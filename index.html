<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Titre unique et descriptif -->
    <title>Amine Hiking Journal - Journal d'Aventures & Randonnées en Montagne</title>
    
    <!-- Meta Description -->
    <meta name="description" content="Découvrez les aventures, itinéraires, fiches techniques et photographies de randonnées en montagne par Amine Sellami. Explorez les plus beaux sommets." />
    <meta name="keywords" content="randonnée, montagne, journal de randonnée, Tikjda, Akfadou, Aurès, Djurdjura, outdoor, aventure, Amine Sellami" />
    <meta name="author" content="Amine Sellami" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/hike1.webp" />

    <!-- Balises Open Graph (WhatsApp, Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amine Hiking Journal" />
    <meta property="og:url" content="https://amine-hiking-journal.netlify.app/" />
    <meta property="og:title" content="Amine Hiking Journal - Journal d'Aventures & Randonnées" />
    <meta property="og:description" content="Découvrez mes expéditions en montagne, photos de paysages et guides d'itinéraires à travers les plus beaux sommets." />
    <meta property="og:image" content="https://amine-hiking-journal.netlify.app/amine1.webp" />
    <meta property="og:image:alt" content="Amine Hiking Journal - Exploration en montagne" />

    <!-- Balises Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amine Hiking Journal - Journal d'Aventures & Randonnées" />
    <meta name="twitter:description" content="Découvrez mes expéditions en montagne, photos de paysages et guides d'itinéraires à travers les plus beaux sommets." />
    <meta name="twitter:image" content="https://amine-hiking-journal.netlify.app/amine1.webp" />

    <!-- ⚡ Anti-cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <!-- Conteneur principal pour React -->
    <div id="root"></div>

    <!-- Vite injecte automatiquement le script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
